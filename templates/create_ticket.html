{% extends "base.html" %}



{% block title %}New Ticket — IT Service Desk{% endblock %}

{% block content %}


<div class="flex flex-between mb-16">
    <h1 class="page-heading" style="margin-bottom:0;">Create New Ticket</h1>
    <a href="/dashboard" class="btn btn-secondary">← Back to Dashboard</a>
</div>


<div class="card" style="max-width:680px;">
    <p class="card-title">Ticket Details</p>


    <form action="/tickets/new" method="POST" enctype="multipart/form-data">


        <div class="form-group">
            <label for="title">Title <span style="color:#E53935;">*</span></label>
            <input type="text" id="title" name="title" maxlength="100" required>
        </div>


        <div class="form-group">
            <label for="description">
                Description <span style="color:#E53935;">*</span>
            </label>
            <textarea id="description" name="description" rows="5" required></textarea>
        </div>


        <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px;">


            <div class="form-group" style="margin-bottom:0;">
                <label for="category_id">
                    Category <span style="color:#E53935;">*</span>
                </label>
                <select id="category_id" name="category_id" required>
                    <option value="" disabled selected>— Select a category —</option>
                    {% for category in categories %}
                    <option value="{{ category.category_id }}">
                        {{ category.category_name }}
                    </option>
                    {% endfor %}
                </select>
            </div>


            <div class="form-group" style="margin-bottom:0;">
                <label for="priority">Priority</label>
                <select id="priority" name="priority">

                    <option value="Low">Low — 7-day SLA</option>
                    <option value="Medium">Medium — 3-day SLA</option>
                    <option value="High">High — 1-day SLA</option>
                </select>
            </div>

        </div>


        <div class="form-group" style="margin-top:18px;">
            <label for="file">Attachment <span class="text-muted">(Optional)</span></label>
            <input type="file" id="file" name="file" accept=".png,.jpg,.jpeg,.pdf"
                style="padding:8px; background:#F8FAFE; cursor:pointer;">
            <p style="font-size:0.78rem; color:#90A4AE; margin-top:4px;">
                Accepted formats: PNG, JPG, JPEG, PDF &mdash; max 5 MB
            </p>
        </div>


        <div style="display:flex; gap:12px; margin-top:8px;">
            <button type="submit" class="btn btn-primary">Submit Ticket</button>
            <a href="/dashboard" class="btn btn-secondary">Cancel</a>
        </div>

    </form>
</div>

{% endblock %}
